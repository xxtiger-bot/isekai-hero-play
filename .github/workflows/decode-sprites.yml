name: Decode Higgs sprites

on:
  push:
    branches: [main]
    paths:
      - 'assets/_payloads/higgs-sprites.tar.b64'
      - '.github/workflows/decode-sprites.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack sprite tar
        run: |
          python3 - <<'PY'
          import base64, pathlib, tarfile, io
          payload = pathlib.Path('assets/_payloads/higgs-sprites.tar.b64')
          if not payload.exists():
              raise SystemExit('missing payload')
          data = base64.b64decode(payload.read_text().strip())
          with tarfile.open(fileobj=io.BytesIO(data), mode='r') as tf:
              # keep assets/sprites/higgs/* paths
              tf.extractall(path='.')
              for m in tf.getmembers():
                  print(m.name, m.size)
          PY
      - name: Commit sprites
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sprites/higgs
          if git diff --staged --quiet; then
            echo "no sprite changes"
            exit 0
          fi
          git commit -m "Add Higgsfield subset sprites for 55089734 preview"
          git push
